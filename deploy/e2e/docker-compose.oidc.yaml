# Production-profile OIDC overlay for platform e2e.
services:
  mock-oidc:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./mocks:/app/mocks:ro
    command: >
      bash -lc "pip install --quiet fastapi 'uvicorn[standard]' 'PyJWT[crypto]' cryptography &&
      uvicorn mocks.mock_oidc:app --host 0.0.0.0 --port 8080"
    ports:
      - "18083:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway-a:
    environment:
      GATEWAY_PROFILE: production
      GATEWAY_API_KEYS: ""
      OIDC_JWT_VERIFY: "true"
      OIDC_JWT_REQUIRE_ISS_AUD: "true"
      OIDC_JWKS_URL: http://mock-oidc:8080/jwks
      OIDC_JWT_ISSUER: http://mock-oidc:8080
      OIDC_JWT_AUDIENCE: ai-runtime
      REQUIRE_AUTH: "true"
      REQUIRE_CONTROL_PLANE: "true"
      REQUIRE_SHARED_STATE: "true"
      GATEWAY_REPLICAS: "2"
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: http://mock-control-plane:8080
      GOVERNANCE_ENFORCEMENT: "true"
      GOVERNANCE_FAIL_OPEN: "false"
      MODEL_TARGETS: '{"llama3.1:8b":{"url":"http://mock-openai:8000/v1","input_cost_per_million":0,"output_cost_per_million":0,"health_path":"/health","provider":"ollama"}}'
      OTEL_SDK_DISABLED: "true"
    depends_on:
      mock-oidc:
        condition: service_healthy

  gateway-b:
    environment:
      GATEWAY_PROFILE: production
      GATEWAY_API_KEYS: ""
      OIDC_JWT_VERIFY: "true"
      OIDC_JWT_REQUIRE_ISS_AUD: "true"
      OIDC_JWKS_URL: http://mock-oidc:8080/jwks
      OIDC_JWT_ISSUER: http://mock-oidc:8080
      OIDC_JWT_AUDIENCE: ai-runtime
      REQUIRE_AUTH: "true"
      REQUIRE_CONTROL_PLANE: "true"
      REQUIRE_SHARED_STATE: "true"
      GATEWAY_REPLICAS: "2"
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: http://mock-control-plane:8080
      GOVERNANCE_ENFORCEMENT: "true"
      GOVERNANCE_FAIL_OPEN: "false"
      MODEL_TARGETS: '{"llama3.1:8b":{"url":"http://mock-openai:8000/v1","input_cost_per_million":0,"output_cost_per_million":0,"health_path":"/health","provider":"ollama"}}'
      OTEL_SDK_DISABLED: "true"
    depends_on:
      mock-oidc:
        condition: service_healthy
