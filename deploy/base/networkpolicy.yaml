apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-runtime-gateway
  namespace: ai-runtime
  labels:
    app.kubernetes.io/name: ai-runtime-gateway
# Component-scoped egress. Overlay patches may further restrict namespaceSelectors.
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-runtime-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
  egress:
    # Model backends (OpenAI-compatible / vLLM)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ai-runtime
      ports:
        - port: 8000
          protocol: TCP
        - port: 11434
          protocol: TCP
    # Control Plane
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-control-plane
      ports:
        - port: 8080
          protocol: TCP
        - port: 80
          protocol: TCP
    # Redis shared state
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # OpenTelemetry collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4318
          protocol: TCP
    # Cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # JWKS / external IdP HTTPS
    - ports:
        - port: 443
          protocol: TCP
