apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-runtime-gateway
  namespace: ai-runtime
  labels:
    app.kubernetes.io/name: ai-runtime-gateway
spec:
  # Default is single-replica / in-memory. Use overlays/production for HA + Redis.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-runtime-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-runtime-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ai-runtime-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-runtime-gateway
      containers:
        - name: gateway
          image: ghcr.io/justrunme/ai-runtime-platform:2.4.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-runtime-gateway-config
          env:
            - name: GATEWAY_REPLICAS
              value: "1"
            - name: REQUIRE_SHARED_STATE
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: ai-runtime-gateway
            # Auth secret is optional in the base (local/single-node may run open).
            # For GOVERNANCE_MODE=enforce with API-key auth (GATEWAY_PROFILE=internal),
            # create Secret ai-runtime-gateway-auth with key api-keys and remove
            # optional:true (or use overlays/production OIDC instead of API keys).
            # CONTROL_PLANE_URL must be set when GOVERNANCE_MODE=enforce; see
            # overlays/production (required secretKeyRef) and docs/runtime-enforcement-mode.md.
            - name: GATEWAY_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: ai-runtime-gateway-auth
                  key: api-keys
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-runtime-gateway
  namespace: ai-runtime
  labels:
    app.kubernetes.io/name: ai-runtime-gateway
spec:
  selector:
    app.kubernetes.io/name: ai-runtime-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
