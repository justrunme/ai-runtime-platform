# Reference Redis + Sentinel topology for documentation and kubeconform.
# Not production-hardened (no NetworkPolicy TLS sidecars, no PVC encryption).
# Prefer managed Redis; wire REDIS_URL into Secret ai-runtime-redis.
apiVersion: v1
kind: Secret
metadata:
  name: redis-ha-auth
  namespace: ai-runtime
type: Opaque
stringData:
  redis-password: CHANGE_ME
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ai-runtime
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: redis-ha-reference
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: redis-ha-reference
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
            - --masterauth
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-ha-auth
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: ai-runtime
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: ai-runtime
  labels:
    app.kubernetes.io/name: redis-sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-sentinel
    spec:
      containers:
        - name: sentinel
          image: redis:7.4-alpine
          command: ["redis-sentinel"]
          args: ["/etc/redis/sentinel.conf"]
          ports:
            - name: sentinel
              containerPort: 26379
          volumeMounts:
            - name: config
              mountPath: /etc/redis
      volumes:
        - name: config
          configMap:
            name: redis-sentinel-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: ai-runtime
data:
  sentinel.conf: |
    port 26379
    sentinel monitor mymaster redis-0.redis-headless.ai-runtime.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    # Set requirepass / auth-pass via your secret injection process.
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: ai-runtime
spec:
  selector:
    app.kubernetes.io/name: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
