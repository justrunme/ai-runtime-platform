apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-runtime-gateway-config
  namespace: ai-runtime
data:
  GATEWAY_PROFILE: production
  GATEWAY_REPLICAS: "2"
  REQUIRE_SHARED_STATE: "true"
  REQUIRE_AUTH: "true"
  REQUIRE_CONTROL_PLANE: "true"
  OIDC_JWT_VERIFY: "true"
  OIDC_JWT_REQUIRE_ISS_AUD: "true"
  GOVERNANCE_ENFORCEMENT: "true"
  GOVERNANCE_FAIL_OPEN: "false"
