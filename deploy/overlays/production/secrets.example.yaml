# Example Secrets for the production profile. Replace values before apply, or
# manage equivalent Secrets via SealedSecrets / ExternalSecrets / Vault.
# In-cluster Redis from this repository is demo-only; production expects an
# external managed Redis with TLS and credentials.
apiVersion: v1
kind: Secret
metadata:
  name: ai-runtime-redis
  namespace: ai-runtime
type: Opaque
stringData:
  # Prefer rediss:// with TLS and ACL credentials.
  url: rediss://:CHANGE_ME@redis.example.svc:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-runtime-control-plane
  namespace: ai-runtime
type: Opaque
stringData:
  # Required when GOVERNANCE_MODE=enforce (production overlay uses a non-optional
  # secretKeyRef). Without this Secret the Deployment cannot schedule.
  url: https://ai-control-plane.example.svc.cluster.local
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-runtime-oidc
  namespace: ai-runtime
type: Opaque
stringData:
  jwks-url: https://issuer.example/.well-known/jwks.json
  issuer: https://issuer.example
  audience: ai-runtime
---
# Optional for production (OIDC covers auth). Required when using API-key auth
# with GOVERNANCE_MODE=enforce / GATEWAY_PROFILE=internal: set optional:false on
# the GATEWAY_API_KEYS secretKeyRef in the Deployment (see deploy/base/gateway.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: ai-runtime-gateway-auth
  namespace: ai-runtime
type: Opaque
stringData:
  api-keys: "replace-me-key-a,replace-me-key-b"
