apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production expects external Redis + OIDC + Control Plane Secrets.
# See secrets.example.yaml (apply separately after replacing placeholders).
# Demo Redis lives in deploy/overlays/demo-redis and is not HA-safe.
resources:
  - ../../base
patches:
  - path: gateway-patch.yaml
  - path: configmap-patch.yaml
