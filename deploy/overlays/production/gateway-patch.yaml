apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-runtime-gateway
  namespace: ai-runtime
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: gateway
          image: ghcr.io/justrunme/ai-runtime-platform:2.1.0
          env:
            - name: GATEWAY_PROFILE
              value: production
            - name: GATEWAY_REPLICAS
              value: "2"
            - name: REQUIRE_SHARED_STATE
              value: "true"
            - name: REQUIRE_AUTH
              value: "true"
            - name: REQUIRE_CONTROL_PLANE
              value: "true"
            - name: OIDC_JWT_VERIFY
              value: "true"
            - name: OIDC_JWT_REQUIRE_ISS_AUD
              value: "true"
            - name: GOVERNANCE_ENFORCEMENT
              value: "true"
            - name: GOVERNANCE_FAIL_OPEN
              value: "false"
            - name: CONTROL_PLANE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-runtime-control-plane
                  key: url
            - name: OIDC_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: ai-runtime-oidc
                  key: jwks-url
            - name: OIDC_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: ai-runtime-oidc
                  key: issuer
            - name: OIDC_JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: ai-runtime-oidc
                  key: audience
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ai-runtime-redis
                  key: url
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: ai-runtime-gateway
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
