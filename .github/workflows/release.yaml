name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Compatibility proof must pass before publishing image/chart.
  real-control-plane:
    strategy:
      fail-fast: false
      matrix:
        include:
          - control_plane: "2.4.0" # current stable pair
            image: ghcr.io/justrunme/ai-infra-control-plane@sha256:608f7758bd29979c81db146b9d76b83b6a7b906446d31c15dddbabd8c0a13274
          - control_plane: "2.0.0" # supported 2.x baseline
            image: ghcr.io/justrunme/ai-infra-control-plane@sha256:38b4de3e5bbcbfcb4012d9b16650139eb58171cec29aed7424dad807100f0450
          - control_plane: "1.3.0" # legacy compatibility
            image: ghcr.io/justrunme/ai-infra-control-plane@sha256:29d282ab7d0b60742e56e44aaeca76054cca4d5358d165f80ae47c37ae3c4ec6
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/platform-e2e-real-cp-reusable.yaml
    with:
      control_plane_image: ${{ matrix.image }}
      control_plane_ref: ${{ matrix.control_plane }}

  release:
    needs: [real-control-plane]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      packages: write # push image and chart to GHCR
      id-token: write # keyless cosign signing and provenance
      attestations: write # build provenance attestation
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if gh release view "${tag_name}" >/dev/null 2>&1; then
            echo "Release ${tag_name} already exists"
          else
            gh release create "${tag_name}" --verify-tag --title "${tag_name}" --generate-notes
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: ai-runtime-gateway-sbom.spdx.json
          output-file: ai-runtime-gateway-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOM (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle ai-runtime-gateway-sbom.spdx.json.sigstore.json \
            ai-runtime-gateway-sbom.spdx.json

      - name: Attach SBOM and signature bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            ai-runtime-gateway-sbom.spdx.json \
            ai-runtime-gateway-sbom.spdx.json.sigstore.json --clobber

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image (keyless)
        run: cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify signed image
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package, push, and sign vLLM Helm chart
        env:
          CHART_OCI: ghcr.io/justrunme/charts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/vllm-runtime --version "$VERSION" --app-version "$VERSION"
          push_out="$(helm push "vllm-runtime-${VERSION}.tgz" "oci://${CHART_OCI}" 2>&1)"
          echo "$push_out"
          digest="$(printf '%s\n' "$push_out" | sed -n 's/.*sha256:\([a-f0-9]\{64\}\).*/sha256:\1/p' | tail -n1)"
          if [[ -z "$digest" ]]; then
            echo "failed to parse Helm OCI digest from helm push output" >&2
            exit 1
          fi
          cosign sign --yes --registry-referrers-mode=legacy "${CHART_OCI}/vllm-runtime@${digest}"
