name: Platform e2e (HA closed-loop)

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ha-closed-loop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - control_plane: "2.4.0"
            image: ghcr.io/justrunme/ai-infra-control-plane@sha256:608f7758bd29979c81db146b9d76b83b6a7b906446d31c15dddbabd8c0a13274
    env:
      CONTROL_PLANE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Generate Runtime verify signing key
        run: |
          openssl genrsa -out /tmp/runtime-verify-e2e.pem 2048
          {
            echo "RUNTIME_VERIFY_PRIVATE_KEY_B64<<EOF"
            base64 -w0 /tmp/runtime-verify-e2e.pem
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Start HA stack
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.oidc.yaml \
            -f deploy/e2e/docker-compose.real-cp.yaml \
            -f deploy/e2e/docker-compose.ha.yaml \
            up --build -d
      - name: Run HA closed-loop paths
        run: ./deploy/e2e/run_e2e_ha.sh
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.oidc.yaml \
            -f deploy/e2e/docker-compose.real-cp.yaml \
            -f deploy/e2e/docker-compose.ha.yaml \
            logs --no-color | tail -n 500
      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.oidc.yaml \
            -f deploy/e2e/docker-compose.real-cp.yaml \
            -f deploy/e2e/docker-compose.ha.yaml \
            down -v
