name: Platform e2e (real Control Plane)

on:
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  real-control-plane:
    strategy:
      fail-fast: false
      matrix:
        include:
          - control_plane: "2.4.0"
            image: ghcr.io/justrunme/ai-infra-control-plane@sha256:608f7758bd29979c81db146b9d76b83b6a7b906446d31c15dddbabd8c0a13274
          - control_plane: "2.0.0"
            image: ghcr.io/justrunme/ai-infra-control-plane@sha256:38b4de3e5bbcbfcb4012d9b16650139eb58171cec29aed7424dad807100f0450
          - control_plane: "1.3.0"
            image: ghcr.io/justrunme/ai-infra-control-plane@sha256:29d282ab7d0b60742e56e44aaeca76054cca4d5358d165f80ae47c37ae3c4ec6
          - control_plane: "main"
            image: ghcr.io/justrunme/ai-infra-control-plane:main
    uses: ./.github/workflows/platform-e2e-real-cp-reusable.yaml
    with:
      control_plane_image: ${{ matrix.image }}
      control_plane_ref: ${{ matrix.control_plane }}

  publish-matrix:
    needs: real-control-plane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: compat-*
          path: /tmp/compat-results
          merge-multiple: false
      - name: Publish compatibility table
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/render-compat-matrix.py /tmp/compat-results \
            --run-url "$RUN_URL" \
            --output docs/compatibility.md
          tee -a "$GITHUB_STEP_SUMMARY" < docs/compatibility.md
      - name: Upload compatibility markdown
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-md
          path: docs/compatibility.md
