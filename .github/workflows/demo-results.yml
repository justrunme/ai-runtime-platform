name: Demo results

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read

jobs:
  record-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install recorders
        run: |
          python -m pip install asciinema==2.4.0
          npm install -g svg-term-cli@2.1.1
      - name: Record platform e2e
        run: |
          mkdir -p docs/assets
          asciinema rec --overwrite -c './deploy/e2e/run_e2e.sh' docs/assets/platform-e2e.cast
          svg-term --in docs/assets/platform-e2e.cast --out docs/assets/platform-e2e.svg --window --width 100 --height 24 --no-cursor
          python3 scripts/write_demo_results.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-results
          path: |
            docs/assets/platform-e2e.cast
            docs/assets/platform-e2e.svg
            docs/results.json
