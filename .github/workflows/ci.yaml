name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: python -m ruff check app experiments
      - run: python -m ruff format --check app experiments
      - run: python -m pytest

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xf kubeconform.tar.gz
          sudo install kubeconform /usr/local/bin/
      - name: Helm lint
        run: helm lint charts/vllm-runtime
      - name: Validate rendered chart
        run: helm template qwen charts/vllm-runtime | kubeconform -strict -ignore-missing-schemas -summary
      - name: Validate kustomize base
        run: kubectl kustomize deploy/base | kubeconform -strict -ignore-missing-schemas -summary
      - name: Validate kustomize overlays
        run: |
          kubectl kustomize deploy/overlays/single-node | kubeconform -strict -ignore-missing-schemas -summary
          kubectl kustomize deploy/overlays/production | kubeconform -strict -ignore-missing-schemas -summary

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: ai-runtime-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
