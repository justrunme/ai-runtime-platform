name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: python -m ruff check app experiments
      - run: python -m ruff format --check app experiments
      - run: python -m pytest

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xf kubeconform.tar.gz
          sudo install kubeconform /usr/local/bin/
      - name: Helm lint
        run: helm lint charts/vllm-runtime
      - name: Validate rendered chart
        run: helm template qwen charts/vllm-runtime | kubeconform -strict -ignore-missing-schemas -summary
      - name: Validate kustomize base
        run: kubectl kustomize deploy/base | kubeconform -strict -ignore-missing-schemas -summary
      - name: Validate kustomize overlays
        run: |
          kubectl kustomize deploy/overlays/single-node | kubeconform -strict -ignore-missing-schemas -summary
          kubectl kustomize deploy/overlays/production | kubeconform -strict -ignore-missing-schemas -summary
          kubectl kustomize deploy/overlays/demo-redis | kubeconform -strict -ignore-missing-schemas -summary

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ai-runtime-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  platform-e2e:
    runs-on: ubuntu-latest
    needs: [python, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start platform stack (mock Control Plane)
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.admission.yaml \
            up --build -d
      - name: Run golden paths
        run: ./deploy/e2e/run_e2e.sh
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.admission.yaml \
            logs --no-color | tail -n 400
      - name: Tear down mock stack
        if: always()
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.admission.yaml \
            down -v

  platform-e2e-oidc:
    runs-on: ubuntu-latest
    needs: [python, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start OIDC production-profile stack
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.oidc.yaml \
            -f deploy/e2e/docker-compose.admission.yaml \
            up --build -d
      - name: Run OIDC golden paths
        run: ./deploy/e2e/run_e2e_oidc.sh
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.oidc.yaml \
            -f deploy/e2e/docker-compose.admission.yaml \
            logs --no-color | tail -n 400
      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f deploy/e2e/docker-compose.yaml \
            -f deploy/e2e/docker-compose.oidc.yaml \
            -f deploy/e2e/docker-compose.admission.yaml \
            down -v
