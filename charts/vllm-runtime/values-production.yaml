# Production profile for GPU inference.
replicaCount: 1
strategy:
  type: Recreate
terminationGracePeriodSeconds: 180
persistence:
  enabled: true
  size: 200Gi
shm:
  enabled: true
  sizeLimit: 16Gi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
model:
  tensorParallelSize: 1
  gpuMemoryUtilization: "0.90"
startupProbe:
  failureThreshold: 120
  periodSeconds: 10
