{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vllm-runtime.fullname" . }}
  labels:
    {{- include "vllm-runtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vllm-runtime.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
