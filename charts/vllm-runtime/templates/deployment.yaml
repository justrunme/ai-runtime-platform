apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm-runtime.fullname" . }}
  labels:
    {{- include "vllm-runtime.labels" . | nindent 4 }}
  annotations:
    checksum/values: {{ toJson .Values | sha256sum }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "vllm-runtime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vllm-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: ai-runtime
      annotations:
        {{- if .Values.model.artifactDigest }}
        ai.runtime/model-digest: {{ .Values.model.artifactDigest | quote }}
        {{- end }}
        {{- if .Values.model.revision }}
        ai.runtime/model-revision: {{ .Values.model.revision | quote }}
        {{- end }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
        {{- if .Values.gpuType }}
        nvidia.com/gpu.product: {{ .Values.gpuType | quote }}
        {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --model={{ .Values.model.name }}
            - --served-model-name={{ .Values.model.servedName }}
            - --gpu-memory-utilization={{ .Values.model.gpuMemoryUtilization | quote }}
            - --max-model-len={{ .Values.model.maxModelLen | quote }}
            - --tensor-parallel-size={{ .Values.model.tensorParallelSize }}
            - --dtype={{ .Values.model.dtype }}
            {{- if .Values.model.revision }}
            - --revision={{ .Values.model.revision }}
            {{- end }}
            {{- if .Values.model.quantization }}
            - --quantization={{ .Values.model.quantization }}
            {{- end }}
            {{- range .Values.model.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- if .Values.huggingface.existingSecret }}
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.huggingface.existingSecret }}
                  key: {{ .Values.huggingface.tokenKey }}
            {{- end }}
            - name: HF_HOME
              value: {{ .Values.persistence.mountPath | quote }}
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: model-cache
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.shm.enabled }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "vllm-runtime.fullname" . }}-cache
        {{- end }}
        {{- if .Values.shm.enabled }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.sizeLimit }}
        {{- end }}
