apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vllm-runtime.fullname" . }}
  labels:
    {{- include "vllm-runtime.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
